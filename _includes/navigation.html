{%- assign _section = page.section -%}
{%- if page.collection == "posts" -%}{%- assign _section = "content" -%}{%- endif -%}
{%- if page.collection == "projects" -%}{%- assign _section = "research" -%}{%- endif -%}
<nav class="navbar links scroll">
  {% for item in t.nav %}
  <a href="{{ item.url | relative_url }}"{% if item.key == _section %} class="active" aria-current="page"{% endif %}>{{ item.title }}</a>
  {% endfor %}
</nav>
