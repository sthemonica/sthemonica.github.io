{%- include i18n.html -%}
{%- assign projetos = site.projects | where: "lang", lang | sort: "ordem" -%}
<h2 class="page-title">{{ t.nav[1].title }}</h2>
<p class="page-intro">{{ t.research_intro }}</p>
<div class="ProjectContainer">
  <div class="gallery">
  {% for project in projetos %}
    <div class="projectTile">
      <a href="{% if project.redirect %}{{ project.redirect }}{% else %}{{ project.url | relative_url }}{% endif %}"{% if project.redirect %} target="_blank" rel="noopener"{% endif %}>
        <span>
          <h2>{{ project.title }}</h2>
          <p>{{ project.description }}</p>
        </span>
      </a>
    </div>
  {% endfor %}
  </div>
</div>
